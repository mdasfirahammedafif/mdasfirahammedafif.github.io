<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1919"/>
      <stop offset="100%" stop-color="#0d0c0c"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d1d0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Dark Architectural Container -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="507" height="507" rx="121.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Ambient light -->
  <circle cx="256" cy="240" r="160" fill="#ffffff" opacity="0.03"/>

  <!-- Monogram Logo "A" with Precision Tech Dot -->
  <g filter="url(#softGlow)">
    <!-- Stylized Geometric "A" -->
    <path d="M256 100 L370 380 L312 380 L283 306 L229 306 L200 380 L142 380 Z M256 178 L238 256 L274 256 Z" 
          fill="url(#textGrad)" fill-rule="evenodd"/>
    
    <!-- Code Accent Dot -->
    <circle cx="396" cy="374" r="12" fill="#ffffff"/>
  </g>
</svg>
